name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, vet, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Install PC/SC headers
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpcsclite-dev
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  e2e-linux:
    name: Linux network end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the scenarios in a privileged container
        run: |
          . packaging/toolchain.env
          docker pull --quiet "$GOLANG_IMAGE"
          docker run --rm --privileged --cap-add NET_ADMIN -v "$PWD":/src -w /src \
            "$GOLANG_IMAGE" bash test/e2e/linux/run.sh

  wireguard-upstream:
    name: third_party/wireguard-go upstream tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - run: go test ./...
        working-directory: third_party/wireguard-go

  dco:
    name: Developer Certificate of Origin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Signed-off-by lines
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range=$PR_BASE..$PR_HEAD
          elif git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range=$PUSH_BEFORE..$PUSH_AFTER
          else
            # A forced push or the first push: no earlier commit to compare with.
            range=$PUSH_AFTER~1..$PUSH_AFTER
          fi
          sh packaging/check-dco.sh "$range"

  lint:
    name: Lint scripts, workflows, licence list
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: shellcheck
        run: |
          find packaging test -type f \( -name '*.sh' -o -path '*/linux/deb/*' -o -path '*/linux/rpm/*' -o -name postinstall \) -print0 |
            xargs -0 shellcheck -x -S warning
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest
      - name: Licence list is up to date
        run: sh packaging/third-party.sh --check

  windows-build:
    name: Windows build (non-blocking until the Windows port lands)
    runs-on: windows-latest
    timeout-minutes: 15
    # Remove this line when the Windows work is on main.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - run: go build ./...
